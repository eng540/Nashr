[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nashr"
version = "0.1.0"
description = "Greenfield content factory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.8,<3.0",
  "asyncpg>=0.29,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "google-genai>=2.23,<3.0",
  "httpx>=0.27,<1.0",
  "pypdf>=6.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires local PostgreSQL and applied Alembic migrations",
  "gemini: requires GEMINI_API_KEY and makes a live Gemini API request",
]

[tool.setuptools.packages.find]
include = ["app*"]

name: test

on:
  pull_request:
  push:
    branches:
      - main
      - feature/vertical-slice-1

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nashr
          POSTGRES_USER: nashr
          POSTGRES_PASSWORD: nashr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nashr -d nashr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nashr:nashr@localhost:5432/nashr
      STORAGE_PATH: ./storage/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install ".[test]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run backend tests
        run: |
          pytest tests/unit -q
          pytest tests/integration -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend unit tests
        run: npm --prefix frontend test

      - name: Frontend production build
        run: npm --prefix frontend run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Seed browser E2E database
        run: python frontend/e2e/seed.py

      - name: Start FastAPI for browser E2E
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/nashr-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Browser E2E
        run: npm --prefix frontend run e2e

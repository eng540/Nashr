services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nashr
      POSTGRES_USER: nashr
      POSTGRES_PASSWORD: nashr
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  postgres_data:
